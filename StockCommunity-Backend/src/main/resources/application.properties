spring.application.name=stockcommunity


# 資料庫相關資訊
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}



spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

######## 模擬交易帳戶 ##########
# 一般會員註冊或首次初始化時取得的模擬起始資金
trading.initial-cash=1000000.00
# 系統造市商使用獨立且較高的模擬資金額度
trading.system-account.initial-cash=1000000000.00

######## 優雅停機 (Graceful Shutdown) ##########
# 是否等待剩餘任務完成
spring.task.execution.shutdown.await-termination=true
# 最長等待時間(實際跑時可能拉長，好處理還在引擎中停留的訂單)
spring.task.execution.shutdown.await-termination-period=5s

######## 股票資訊獲取設定 ##########
# 公司資訊同步設定 (範例設定為每 6 小時同步一次)
# 1000 = 1秒, 3600000 = 1小時, 604800000 = 1周
stock.sync.fixed-rate=604800000
# 啟動後延遲 一分鐘 執行第一次 (60000 毫秒)
stock.sync.initial-delay=60000

######## 造市者模組設定檔 ##########
# 設定造市者模組更新時間:20秒
market-maker.scheduled.fixedRate = 20000
# 設定造市者持倉的初始股票
market-maker.stocks = 2330, 2454, 2308, 2317, 2303
# 設定造市者初始持倉
market-maker.initial-holding = 10000
# 設定造市者持倉的最大最小股數，避免小於零還掛單
market-maker.max.holding.quantity = 20000
market-maker.min.holding.quantity = 0
# 限制每次生成訂單時最多操作多少股數
market-maker.generateMMOrders.quantity = 2000
# 每支股票總共生產幾組訂單
market-maker.generateMMOrders.time = 2

######## FinMind 歷史股價設定 ##########
finmind.base-url=https://api.finmindtrade.com/api/v4
# 有去 https://finmindtrade.com 註冊帳號拿到 token 的話填這裡，額度比較高；沒有先留空也能動
# FinMind API 免費會員限流：未登入每小時300次，註冊登入(帶token)每小時600次，超過回傳402錯誤
finmind.token=
# 批次補資料時，每打完一檔股票要停頓幾毫秒；如果 log 出現 FinMind 狀態碼 402（被限流），把這個數字調大
finmind.backfill.delay-ms=2000

######## 歷史股價自動補資料排程設定 ##########
# 排程要補哪些股票代號，逗號分隔、逗號後面不要留空格(不然會查不到資料)；之後範圍擴大只要改這行，不用動程式碼
stock.backfill.codes=2330

# ,1101,1102,1103,1104,1108,1109,1110,1201,1203

# 排程執行時間，cron格式「秒 分 時 日 月 星期」，目前設每天下午3點(收盤後)跑一次
stock.backfill.cron=0 0 15 * * *

# 忘記密碼寄信功能，目前由使用者模組（WG）負責維護與測試
# 真實帳密不會放在這裡，只設定在負責人自己電腦的 application-local.properties（不會進 git）
# 其他人不用設定，留空即可，程式一樣正常啟動，只是這支功能在自己電腦上不會真的寄出信
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 用來簽名/驗證登入後的JWT token，沒設定這個值，程式會直接啟動失敗
# 正式環境請自行設定,此為預設測試用（英數字32字元以上）
jwt.secret=${JWT_SECRET}